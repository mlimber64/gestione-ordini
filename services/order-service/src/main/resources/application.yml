spring:
  application:
    name: order-service
  # In locale si usa il profilo dev. In produzione impostare SPRING_PROFILES_ACTIVE e le variabili JWT_SECRET e ADMIN_PASSWORD.
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/gestione_ordini}
    username: ${DB_USER:ordini}
    password: ${DB_PASSWORD:ordini_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  mvc:
    problemdetails:
      enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: gestione-ordini
      access-ttl: 15m
      refresh-ttl: 7d
    bootstrap-admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
