spring:
  application:
    name: order-service
  # In locale si usa il profilo dev. In produzione impostare SPRING_PROFILES_ACTIVE e le variabili JWT_SECRET e ADMIN_PASSWORD.
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/gestione_ordini}
    username: ${DB_USER:ordini}
    password: ${DB_PASSWORD:ordini_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      # Nessuna perdita e nessun duplicato per ritentativo: acks=all con producer idempotente
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000
  mvc:
    problemdetails:
      enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: gestione-ordini
      access-ttl: 15m
      refresh-ttl: 7d
    bootstrap-admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}
  outbox:
    # polling: un relay dell'applicazione porta gli eventi a Kafka. cdc: li porta Debezium (profilo cdc del compose, ADR 0019)
    mode: ${OUTBOX_MODE:polling}
    cleanup-cron: "0 30 3 * * *"
    relay:
      poll-interval: 1s
      batch-size: 50
      send-timeout-seconds: 10

server:
  port: ${SERVER_PORT:8081}
  # Dietro nginx lo schema originale (http o https) arriva nell'intestazione X-Forwarded-Proto: serve al cookie Secure.
  # Va bene perché le porte dei servizi non sono pubblicate: dall'esterno si arriva solo da nginx.
  forward-headers-strategy: framework

management:
  metrics:
    distribution:
      # Serve a Grafana per calcolare la latenza p95
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
