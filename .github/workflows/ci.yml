name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # I test di integrazione usano Testcontainers: Docker è già disponibile sul runner.
      # verify esegue anche il controllo di copertura minima (JaCoCo).
      - run: ./mvnw -B verify
      # Classi compilate e copertura servono al job di analisi SonarCloud
      - uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/classes
            services/${{ matrix.service }}/target/site/jacoco/jacoco.xml
          retention-days: 1

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/web/lcov.info
          retention-days: 1

  # Le immagini Docker devono costruirsi: un Dockerfile rotto si scopre qui e non al momento del rilascio.
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/docker-compose.yml --profile app build

  # Analisi SonarCloud: parte solo se nel repository esiste il segreto SONAR_TOKEN (e non nei pull request da fork).
  sonar:
    name: sonarcloud
    needs: [backend, web]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          pattern: backend-*
          path: artifacts
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: web-coverage
          path: web/coverage/web
      - name: Sposta i risultati dove li cerca sonar-project.properties
        if: env.SONAR_TOKEN != ''
        run: |
          for service in order-service notification-service; do
            mkdir -p "services/$service/target"
            cp -r "artifacts/backend-$service/." "services/$service/target/"
          done
          # La copertura del frontend ha percorsi relativi a web/: SonarCloud li cerca dalla radice del repository
          sed -i 's#^SF:src/#SF:web/src/#' web/coverage/web/lcov.info
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
