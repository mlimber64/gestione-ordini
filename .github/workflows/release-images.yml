name: Immagini Docker

# Pubblica le immagini nel registro di GitHub (ghcr.io) quando si crea una versione (tag v*).
# Una modifica a questo stesso file, in un pull request, costruisce le immagini senza pubblicarle: serve a provare il flusso.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release-images.yml"]

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: order-service
            context: services/order-service
          - image: notification-service
            context: services/notification-service
          - image: web
            context: web
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Da v1.2.3 produce i tag 1.2.3, 1.2 e latest (latest non per le versioni di prova come v1.2.3-rc1);
      # aggiunge anche le etichette OCI, tra cui il collegamento al repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
