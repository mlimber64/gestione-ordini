version: 2
updates:
  - package-ecosystem: maven
    directory: /services/order-service
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /services/notification-service
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Angular 22 richiede TypeScript >=6.0 <6.1: le versioni successive non sono compatibili
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    ignore:
      # Stessa versione di TypeScript del frontend
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
