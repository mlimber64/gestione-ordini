# Un solo indirizzo per il browser: file statici, API di order-service e notifiche in tempo reale.
# Lo stesso contenuto è servito in HTTP (porta 80) e in HTTPS con HTTP/2 (porta 443): i browser usano HTTP/2 solo
# con TLS e, senza, ogni scheda aperta con il suo stream SSE si contende le ~6 connessioni per origine di HTTP/1.1.

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificato autofirmato creato all'avvio del container (docker-entrypoint.d/40-certificato.sh);
    # per un certificato vero basta montare i due file in /etc/nginx/certs.
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/app.conf;
}
