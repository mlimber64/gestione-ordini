# Analisi di qualità su SonarCloud (vedi docs/qualita.md per l'attivazione).
sonar.projectKey=mlimber64_gestione-ordini
sonar.organization=mlimber64
sonar.projectName=Gestione Ordini

# Codice e test dei tre componenti
sonar.sources=services/order-service/src/main/java,services/notification-service/src/main/java,web/src/app
sonar.tests=services/order-service/src/test/java,services/notification-service/src/test/java,web/src/app
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/testing.ts

# Compilati e copertura prodotti dalla CI
sonar.java.binaries=services/order-service/target/classes,services/notification-service/target/classes
sonar.coverage.jacoco.xmlReportPaths=services/order-service/target/site/jacoco/jacoco.xml,services/notification-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=web/coverage/web/lcov.info

sonar.sourceEncoding=UTF-8
